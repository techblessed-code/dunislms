<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dunis LMS</title>
</head>
<body>
    <h2> Login - Dunis LMS</h2>
    <form method="post">
        {% csrf_token %}
        <label for="id_username">Username</label>
        <input type="text", name="username" id="id_username" required><br>

        <label for="id_username">Password</label>
        <input type="password", name="password" id="id_password" required><br>

        <button type="submit">Login</button>

    </form>
</body>
</html>
