<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Dunis LMS</title>
</head>
<body>
    <h1>Welcome {{ user.username }}</h1>
    Email = {{ request.user.email }}
    {% comment %}
      Logout must be a POST form: since Django 5.0 the built-in LogoutView
      answers 405 to GET requests.
    {% endcomment %}
    <form action="{% url 'users:logout' %}" method="post">
        {% csrf_token %}
        <button type="submit" style="pointer-events: stroke;">Logout</button>
    </form>

    <p><a href="{% url 'courses:course_list' %}">Browse courses</a></p>

    <h3>This is your unique dashboard allowing you to view your profile</h3>

</body>
</html>
