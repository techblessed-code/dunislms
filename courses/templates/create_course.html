<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Form</title>
</head>
<body>
    <h1>Create a New Course</h1>
    <form method="post" enctype="multipart/form-data">
        {% comment %}
          {% csrf_token %} 
        {% endcomment %}

        {{ form.as_p }}
        <button type="submit">Create Course</button>
    </form>
</body> 
</html>
