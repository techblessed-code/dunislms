<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
    
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
        }

        .card-text {
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>
    <h1>Courses</h1>
    <ul>
        
     <div class="card-container">
        {% for course in courses %}
            <div class="card">
                  {% if course.image %}
                 <img src="{{ course.image.url}}" alt="{{ course.title }}"> 
                 {% else %}
                  <img src="" alt="{{ course.title }}"> 
                 {% endif %}
            <div class="card-body">
                <div class="card-title">{{ course.title }}</div>
                <div class="card-text">{{ course.description|truncatewords:20 }}</div>
                <div class="card-text">{{ course.instructor }}</div>
            </div>
     </div>
              <li>{{ course.title }}</li>
        {% endfor %}
    </ul>
    <a href="{% url 'create_course' %}">Create New Course</a>
</body>
</html>
