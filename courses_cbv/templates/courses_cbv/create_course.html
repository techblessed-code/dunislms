

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'courses_cbv/main.css' %}">
</head>
<body>
    <div class="body">
        <div class="page-stack">

            <section class="page-hero">
                <p class="eyebrow">Course Form</p>
                <h1>Create Course</h1>
                <p class="page-subtitle">
                    Add a new course using the class-based view workflow.
                </p>
            </section>

            <section class="panel form-panel">
                <p class="form-intro">
                    Enter the course information below and submit the form when it is ready.
                </p>

                <form class="form-layout" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit">
                            Create Course
                        </button>

                        <a class="btn btn-nav"
                           href="{% url 'courses_cbv:course_list' %}">
                            Cancel
                        </a>
                    </div>
                </form>
            </section>

        </div>
    </div>
</body>
</html>
